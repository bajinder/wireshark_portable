# Countable — XcodeGen project spec.
#
# Generate the .xcodeproj with:
#   xcodegen generate
# (or just run ./bootstrap.sh, which does this and prints next steps)
#
# TO CHANGE BUNDLE IDENTIFIERS: search this file for "com.bajinder.countable" and
# replace consistently (app id, widget id = app id + ".widgets", test ids). The App
# Group identifier must be changed in THREE places kept in sync:
#   1. Sources/Countable.entitlements
#   2. Widgets/CountableWidgetsExtension.entitlements
#   3. Shared/Constants/AppGroup.swift (the `identifier` constant)

name: Countable

options:
  bundleIdPrefix: com.bajinder.countable
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  usesTabs: false
  indentWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Countable:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
    resources:
      - path: Sources/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bajinder.countable
        PRODUCT_NAME: Countable
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    info:
      properties:
        CFBundleDisplayName: Countable
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Sources/Countable.entitlements
    dependencies:
      - target: CountableWidgetsExtension
        embed: true
    scheme:
      testTargets:
        - CountableTests
        - CountableUITests
      # Local StoreKit testing (see Countable.storekit at the project root). If Xcode
      # doesn't resolve this automatically after `xcodegen generate`, open the scheme
      # editor (Product > Scheme > Edit Scheme > Run > Options) and pick it manually.
      storeKitConfiguration: Countable.storekit

  CountableWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bajinder.countable.widgets
        PRODUCT_NAME: CountableWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      properties:
        CFBundleDisplayName: Countable Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/CountableWidgetsExtension.entitlements

  # Pure-logic unit tests. Deliberately NOT hosted by (or dependent on) the Countable
  # app target: StreakCalculator and CountdownCalculator are plain value types with no
  # SwiftData/UIKit dependency, so this bundle just compiles Shared/ directly alongside
  # the test sources and runs standalone — no TEST_HOST needed.
  CountableTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CountableTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bajinder.countable.tests
        GENERATE_INFOPLIST_FILE: YES

  # UI tests drive the real app via XCUIApplication, so this one does depend on Countable.
  CountableUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests/CountableUITests
    dependencies:
      - target: Countable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bajinder.countable.uitests
        GENERATE_INFOPLIST_FILE: YES

# Loose files that should show up in the Xcode navigator but aren't compiled/bundled
# into any particular target.
fileGroups:
  - Countable.storekit
  - README.md
  - SHIP.md
