# Countable — CI
#
# Thin workflow only. The canonical macOS-host CI conventions this project follows
# live in ~/infra/templates (shared across apps) — this file just wires up
# Countable's scheme/bundle id into that shape: xcodegen generate, then fastlane.
#
# Assumes this file lives at the root of its own repository (i.e. Countable's
# directory IS the repo root once split out) so all paths below are repo-root
# relative. If Countable stays nested inside a larger monorepo, adjust the
# `working-directory` on each step to point at apps/Countable instead.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  SCHEME: Countable
  APP_IDENTIFIER: com.bajinder.countable

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-host
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: bundle exec fastlane test
        env:
          SCHEME: ${{ env.SCHEME }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}

  beta:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-host
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Ship TestFlight beta
        run: bundle exec fastlane beta
        env:
          SCHEME: ${{ env.SCHEME }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
