name: Catchbook

options:
  bundleIdPrefix: com.bajinder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

fileGroups:
  - Catchbook.storekit
  - README.md
  - SHIP.md

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  Catchbook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
    info:
      path: Generated/Catchbook-Info.plist
      properties:
        CFBundleDisplayName: Catchbook
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Catchbook can tag your catches with the location where you caught them."
        NSPhotoLibraryUsageDescription: "Catchbook can attach a photo of your catch from your photo library."
        NSPhotoLibraryAddUsageDescription: "Catchbook can save catch photos you choose to keep."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bajinder.catchbook
        PRODUCT_NAME: Catchbook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  CatchbookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Catchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bajinder.catchbook.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Catchbook.app/Catchbook"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CatchbookUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Catchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bajinder.catchbook.uitests
        TEST_TARGET_NAME: Catchbook

schemes:
  Catchbook:
    build:
      targets:
        Catchbook: all
        CatchbookTests: [test]
        CatchbookUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Catchbook.storekit
    test:
      config: Debug
      targets:
        - CatchbookTests
        - CatchbookUITests
    archive:
      config: Release
