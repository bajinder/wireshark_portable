# ci.yml
#
# Thin, app-specific copy of the canonical iOS CI workflow template.
# Canonical source of truth: ~/infra/templates/gitea/ios-ci.yml
# Only `SCHEME`/`PROJECT` below should differ per app — keep steps in
# sync with the template rather than hand-editing this pipeline.

name: Catchbook CI

on:
  push:
    branches: [main]
    paths:
      - "apps/Catchbook/**"
  pull_request:
    paths:
      - "apps/Catchbook/**"

env:
  SCHEME: Catchbook
  PROJECT: Catchbook.xcodeproj
  WORKDIR: apps/Catchbook

jobs:
  build-and-test:
    runs-on: macos-host
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./bootstrap.sh

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            | xcbeautify || true

      - name: Unit + UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            | xcbeautify || true
